name: BeautyFlow AI CI

on:
  push:
    branches: [main, feature/platform-foundations, feature/agent-tools-v1, feature/secure-agent-confirmation, feature/llm-assistant-v1]
  pull_request:
    branches: [main, feature/scheduling-v2, feature/platform-foundations, feature/agent-tools-v1, feature/secure-agent-confirmation]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall app frontend tests seed.py

      - name: Validate database seed
        env:
          DATABASE_URL: sqlite:///ci_validation.db
        run: python seed.py

      - name: Run tests
        run: pytest -q
