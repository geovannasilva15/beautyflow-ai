name: BeautyFlow AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: beautyflow
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: beautyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beautyflow -d beautyflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q app frontend migrations tests seed.py
      - name: Run tests with SQLite and PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql://beautyflow:disposable-ci-password@127.0.0.1:5432/beautyflow_test
        run: python -m pytest -q
