services:
  - type: web
    name: beautyflow-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: beautyflow-db
          property: connectionString
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: beautyflow-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS true --server.enableXsrfProtection true
    envVars:
      - key: APP_ENV
        value: production
      - key: API_URL
        value: https://beautyflow-api.onrender.com/api
      - key: API_ACCESS_TOKEN
        fromService:
          type: web
          name: beautyflow-api
          envVarKey: API_ACCESS_TOKEN
      - key: APP_LOGIN_EMAIL
        sync: false
      - key: APP_LOGIN_PASSWORD
        sync: false
databases:
  - name: beautyflow-db
    plan: basic-256mb
    databaseName: beautyflow
    user: beautyflow
