services:
  - type: web
    name: beautyflow-api
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: APP_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: America/Sao_Paulo
      - key: DATABASE_URL
        fromDatabase:
          name: beautyflow-db
          property: connectionString
  - type: web
    name: beautyflow-web
    runtime: python
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableCORS true --server.enableXsrfProtection true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: APP_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: America/Sao_Paulo
      - key: API_URL
        sync: false
      - key: STREAMLIT_SERVER_COOKIE_SECRET
        generateValue: true
databases:
  - name: beautyflow-db
    plan: 0.1c-256mb
    databaseName: beautyflow
    user: beautyflow
    ipAllowList: []
